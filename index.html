<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jiae Money</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#222;--muted:#777;--line:#e9e3da;--accent:#28251f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text)}
.wrap{max-width:720px;margin:auto;padding:24px 16px 80px}h1{font-size:28px;margin:8px 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 8px #0000000a}
.k{font-size:12px;color:var(--muted)}.v{font-size:23px;font-weight:750;margin-top:5px}.wide{grid-column:1/-1}
h2{font-size:18px;margin:25px 2px 10px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.name{font-weight:650}.detail{font-size:12px;color:var(--muted);margin-top:3px}.remain{text-align:right;font-weight:750}.over{color:#b3261e}
.bar{height:7px;background:#eee9e1;border-radius:9px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--accent);width:0}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input,button{font:inherit;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}
input{width:100%}button{background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer}.full{grid-column:1/-1}
.tx{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.tx small{color:var(--muted)}
.del{background:none;color:#999;padding:2px 5px}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
</style>
</head>
<body><main class="wrap">
<h1>Jiae Money</h1><div class="sub">월 예산을 단순하게, 남은 돈은 바로 보이게.</div>
<section class="summary">
<div class="card"><div class="k">월 실수령</div><div class="v">445만원</div></div>
<div class="card"><div class="k">저축 목표</div><div class="v" id="saving">315만원</div></div>
<div class="card"><div class="k">고정비 예산</div><div class="v">45만원</div></div>
<div class="card"><div class="k">생활비 예산</div><div class="v">85만원</div></div>
<div class="card wide"><div class="k">이번 달 생활비 남은 금액</div><div class="v" id="totalRemain">85만원</div></div>
</section>

<h2>생활비</h2><section class="card" id="budgetRows"></section>

<h2>지출 입력</h2><section class="card">
<form id="f">
<select id="cat"></select>
<input id="amt" type="number" inputmode="numeric" min="1" placeholder="금액 (원)" required>
<input id="memo" class="full" placeholder="메모 (예: 점심, 주차)" maxlength="40">
<button class="full">지출 추가</button>
</form>
<div class="note">입력 내용은 이 브라우저에 저장됩니다. 같은 기기·브라우저에서 다시 열면 유지돼요.</div>
</section>

<h2>최근 지출</h2><section class="card" id="txs"><div class="note">아직 입력된 지출이 없어요.</div></section>

<h2>고정비 구성</h2><section class="card">
<div class="row"><div><div class="name">관리비</div></div><div class="remain">20만원</div></div>
<div class="row"><div><div class="name">가스비</div></div><div class="remain">5만원</div></div>
<div class="row"><div><div class="name">핸드폰비</div></div><div class="remain">12만원</div></div>
<div class="row"><div><div class="name">구독료</div></div><div class="remain">5만원</div></div>
<div class="row"><div><div class="name">고정비 여유분</div><div class="detail">실제 금액 변동 대비</div></div><div class="remain">3만원</div></div>
</section>
</main>
<script>
const budgets={"식비":150000,"배달비":150000,"생필품":100000,"쇼핑·미용":150000,"문화·취미":150000,"주유·주차":50000,"가족":100000};
const KEY="jiae-money-v1"; let tx=JSON.parse(localStorage.getItem(KEY)||"[]");
const won=n=>new Intl.NumberFormat("ko-KR").format(n)+"원";
const man=n=>(n/10000).toLocaleString("ko-KR",{maximumFractionDigits:1})+"만원";
const cat=document.querySelector("#cat");
Object.keys(budgets).forEach(k=>cat.add(new Option(k,k)));
document.querySelector("#f").onsubmit=e=>{e.preventDefault();let a=+amt.value;if(!a)return;tx.unshift({id:Date.now(),cat:cat.value,amt:a,memo:memo.value,date:new Date().toLocaleDateString("ko-KR")});localStorage.setItem(KEY,JSON.stringify(tx));amt.value="";memo.value="";render()};
function render(){
 let used={};Object.keys(budgets).forEach(k=>used[k]=0);tx.forEach(t=>used[t.cat]=(used[t.cat]||0)+t.amt);
 budgetRows.innerHTML=Object.entries(budgets).map(([k,b])=>{let u=used[k],r=b-u,p=Math.min(100,u/b*100);return `<div class="row"><div><div class="name">${k}</div><div class="detail">예산 ${man(b)} · 사용 ${man(u)}</div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div><div class="remain ${r<0?'over':''}">${r<0?'초과 ':'남음 '}${man(Math.abs(r))}</div></div>`}).join("");
 let totalUsed=Object.values(used).reduce((a,b)=>a+b,0), remain=850000-totalUsed;
 totalRemain.textContent=(remain<0?"초과 ":"")+man(Math.abs(remain)); totalRemain.className="v "+(remain<0?"over":"");
 saving.textContent=man(3150000+Math.max(0,remain));
 txs.innerHTML=tx.length?tx.slice(0,30).map(t=>`<div class="tx"><div><b>${t.cat}</b><br><small>${t.date}${t.memo?" · "+t.memo:""}</small></div><div>${won(t.amt)}</div><button class="del" onclick="del(${t.id})">×</button></div>`).join(""):'<div class="note">아직 입력된 지출이 없어요.</div>';
}
function del(id){tx=tx.filter(t=>t.id!==id);localStorage.setItem(KEY,JSON.stringify(tx));render()} render();
</script></body></html>
